[defaults]
inventory          = inventory/hosts.yml
roles_path         = roles
remote_user        = root
private_key_file   = ~/.ssh/id_rsa
stdout_callback    = yaml
retry_files_enabled = false

# Disabled because containers are destroyed and recreated frequently.
# Each new container gets a new host key — checking would produce a
# fingerprint mismatch error every time. Enable this in production.
host_key_checking  = False

[ssh_connection]
pipelining         = true
ssh_args           = -o ControlMaster=auto -o ControlPersist=60s
