---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

# SSH must be allowed BEFORE UFW is enabled — wrong order locks you out.
- name: Allow SSH before enabling UFW
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    comment: SSH — pre-enable safety rule

- name: Set UFW default inbound policy to deny
  community.general.ufw:
    default: deny
    direction: incoming

- name: Set UFW default outbound policy to allow
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Allow trusted subnets full access
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    comment: "Trusted subnet"
  loop: "{{ ufw_trusted_subnets }}"

- name: Allow configured ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop: "{{ ufw_allowed_ports }}"

- name: Enable UFW and enable logging
  community.general.ufw:
    state: enabled
    logging: "on"
