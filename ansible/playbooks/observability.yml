---
- name: Deploy observability stack
  hosts: observability
  become: true

  vars:
    nginx_proxy_pass: "localhost:3000"   # Nginx proxies port 80 → Grafana
    observability_dir: /opt/observability

  roles:
    - role: common
    - role: ssh_hardening
    - role: firewall
    - role: docker
    - role: nginx

  tasks:
    - name: Create observability directory
      ansible.builtin.file:
        path: "{{ observability_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write Prometheus config
      ansible.builtin.copy:
        dest: "{{ observability_dir }}/prometheus.yml"
        owner: root
        group: root
        mode: "0644"
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s

          scrape_configs:
            - job_name: prometheus
              static_configs:
                - targets: ["localhost:9090"]

            - job_name: node-exporter
              static_configs:
                - targets: ["node-exporter:9100"]
      notify: Restart prometheus

    - name: Write Docker Compose stack
      ansible.builtin.copy:
        dest: "{{ observability_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"
        content: |
          services:
            prometheus:
              image: prom/prometheus:latest
              container_name: prometheus
              ports:
                - "127.0.0.1:9090:9090"
              volumes:
                - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
                - prometheus_data:/prometheus
              restart: unless-stopped

            node-exporter:
              image: prom/node-exporter:latest
              container_name: node-exporter
              ports:
                - "127.0.0.1:9100:9100"
              volumes:
                - /proc:/host/proc:ro
                - /sys:/host/sys:ro
                - /:/rootfs:ro
              command:
                - "--path.procfs=/host/proc"
                - "--path.sysfs=/host/sys"
                - "--path.rootfs=/rootfs"
              restart: unless-stopped

            grafana:
              image: grafana/grafana:latest
              container_name: grafana
              ports:
                - "127.0.0.1:3000:3000"
              volumes:
                - grafana_data:/var/lib/grafana
              environment:
                - GF_SECURITY_ADMIN_PASSWORD=admin
                - GF_USERS_ALLOW_SIGN_UP=false
              depends_on:
                - prometheus
              restart: unless-stopped

          volumes:
            prometheus_data:
            grafana_data:

    - name: Start observability stack
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ observability_dir }}"
      register: compose_result
      changed_when: >
        'Started' in compose_result.stdout or
        'Created' in compose_result.stdout

    - name: Show access URL
      ansible.builtin.debug:
        msg: "Grafana is available at http://{{ ansible_host }} — login: admin / admin"

  handlers:
    - name: Restart prometheus
      ansible.builtin.command:
        cmd: docker compose restart prometheus
        chdir: "{{ observability_dir }}"
      changed_when: true
